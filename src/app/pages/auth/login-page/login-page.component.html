<div class="login__form-container">
  <app-form
    [formTitle]="'Iniciar sesión'"
    [fields]="loginFields"
    [buttonLabelText]="'Ingresar'"
    (submitForm)="onFormSubmit($event)"
  ></app-form>
  <p class="login__register-p">
    No se encuentra registrado? <a [routerLink]="[registrationRoute]" class="login__register-a">Registrese</a>
  </p>
</div>
