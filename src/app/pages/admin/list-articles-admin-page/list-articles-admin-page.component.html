<div class="list-data-container">
  <section class="list-data-container__header">
    <h4>{{ tableTittleLabel }}</h4>
    <app-button
      [label]="buttonLabelAddBrand"
      (buttonClick)="navigateToCreateArticle()"
    ></app-button>
  </section>
  <app-table-tool-bar
    [showByoptions]="showByOptions"
    [sortByoptions]="sortByOptions"
  ></app-table-tool-bar>

  <section class="list-data-container__data">
    <app-data-table
      #content
      [data]="articlesDataTable"
      [iconCell]="iconAdd"
      [headers]="headers"
      (mouseCoords)="onGetMouseCoords($event)"
      (getArticleId)="onGetArticleSelected($event)"
    ></app-data-table>

    <app-loader></app-loader>
  </section>

  <section class="list-data-container__pagination">
    <app-pagination
      [totalPages]="totalPages"
      [currentPage]="currentPage"
      (pageChange)="onPageChange($event)"
    ></app-pagination>
  </section>
</div>
<ng-container *ngIf="isPopupVisible && selectedArticleId">
  <app-popup-add-supply
    [articleID]="selectedArticleId"
    [articleName]="selectedArticleName"
    [articleStock]="selectedArticleStock"
    [top]="popupPosition.top"
    [left]="popupPosition.left"
    (quantityAddStock)="onAddSupply($event)"
    (close)="closePopup()"
  ></app-popup-add-supply>
</ng-container>
