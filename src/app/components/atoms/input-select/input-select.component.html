<div class="input-container input-container--{{borderType}} input-container--{{ state }}">
  <select class="input-container__select"  (change)="onSelectionChange($event)">
   
    <option class="input-container__option" *ngFor="let option of options" [value]="option.value">
      {{ option.label }}
    </option>
  </select>
  <div
    *ngIf="state === inputStateError"
    class="input-container__error-message"
  >
    {{ errorMessage }}
  </div>
</div>
